      // 첫 화면 깜빡임 방지: 고른 모드를 먼저 적용한다. 첫 방문은 라이트 (PRD 10-1)
      try {
        if (localStorage.getItem('palja:theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (e) {}
    </script>

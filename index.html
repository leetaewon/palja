    <meta charset="UTF-8" />

    <title>팔자록 — 다시 태어나는 기록</title>
    <meta name="description" content="삼국에서 조선까지, 이 땅 어딘가에 무작위로 태어나 한 번의 일생을 사는 텍스트 인생 시뮬레이션. 죽으면 팔자를 고치러 같은 삶으로 돌아갑니다." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="팔자록 — 다시 태어나는 기록" />
    <meta property="og:description" content="이 땅 어딘가에 무작위로 태어나 한 번의 일생을 산다. 죽으면 팔자를 고치러 돌아간다." />

    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <link rel="canonical" href="%SITE_URL%/" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='6' y='6' width='88' height='88' rx='10' fill='%23b0322a'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' fill='%23fbf5ea' font-family='serif'%3E八%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Song+Myung&display=swap" rel="stylesheet" />
    <script>
      // 첫 화면 깜빡임 방지: 고른 모드를 먼저 적용한다. 첫 방문은 라이트 (PRD 10-1)
      try {
        if (localStorage.getItem('palja:theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (e) {}

      // 인앱 브라우저 감지 및 기본 브라우저 자동 전환 (세션·기록 보존)
      (function () {
        try {
          var ua = navigator.userAgent || navigator.vendor || window.opera || '';
          var isIOS = /iPhone|iPad|iPod/i.test(ua);
          var isAndroid = /Android/i.test(ua);
          var currentUrl = window.location.href;

          // 1. 카카오톡 인앱 브라우저 (iOS & Android): 카카오 전용 외부 브라우저 호출 스킴
          if (/KAKAOTALK/i.test(ua)) {
            window.location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(currentUrl);
            return;
          }

          // 2. 안드로이드 인앱 브라우저 (페이스북, 인스타그램, 네이버, 라인 등): Chrome Intent 호출
          if (isAndroid && /FBAN|FBAV|Instagram|NAVER\(inapp|Line\//i.test(ua)) {
            var urlNoScheme = currentUrl.replace(/^https?:\/\//, '');
            window.location.href =
              'intent://' +
              urlNoScheme +
              '#Intent;scheme=https;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;end;';
            return;
          }

          // 3. iOS 인앱 브라우저 (페이스북, 인스타그램, 라인 등): 배너 노출 플래그 설정
          if (isIOS && /FBAN|FBAV|Instagram|Line\//i.test(ua)) {
            document.documentElement.dataset.inAppIos = 'true';
          }
        } catch (err) {}
      })();
    </script>
  </head>
  <body>
    <noscript>이 게임은 자바스크립트가 켜져 있어야 해요.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
